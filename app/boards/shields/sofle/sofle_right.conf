CONFIG_ZMK_POINTING=y

# Power Management & Battery Optimization
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_EXT_POWER=n

# This board target has no zmk,underglow devicetree node wired up (that
# overlay only exists for the nice_nano_nrf52840_zmk board revision), so
# CONFIG_ZMK_RGB_UNDERGLOW must stay off or the build fails.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Disable debug logging over USB
CONFIG_ZMK_USB_LOGGING=n

# Disable display (no OLED screens installed)
CONFIG_ZMK_DISPLAY=n