CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_POINTING=y

# Power Management & Battery Optimization
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000
CONFIG_ZMK_BACKLIGHT=n

# The nice!nano's switchable VCC rail (control-gpios on the ext_power_generic
# node) very likely powers this PCB's LED strip VDD - the keymap's adjust
# layer already has EP_TOG/EP_ON/EP_OFF bindings for it. ext_power_generic.c
# enables this rail by default at boot, so RGB gets power without needing a
# manual toggle. RGB_UNDERGLOW_EXT_POWER=y couples the rail to the RGB
# on/off state so it's cut when RGB is off, instead of staying powered.
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# AUTO_OFF_USB overrides ON_START at boot with zmk_usb_is_powered() (see
# rgb_underglow.c zmk_rgb_underglow_init) - since this runs on battery over
# BLE, that forces the LEDs off regardless of ON_START. Off for now so we can
# confirm the LEDs physically work; re-enable once confirmed if USB-only RGB
# is actually wanted.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Disable debug logging over USB
CONFIG_ZMK_USB_LOGGING=n

# Disable display (no OLED screens installed)
CONFIG_ZMK_DISPLAY=n